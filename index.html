<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APP KEY</title>
<style>
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}
.card{width:min(92vw,420px);padding:24px;border:1px solid #7b0000;border-radius:18px;background:#111;box-shadow:0 0 30px #330000}
h1{margin-top:0;color:#ff3030;text-align:center}.muted{color:#aaa;text-align:center}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #444;background:#181818;color:#fff;margin:14px 0}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#b40000;color:#fff;font-weight:700;margin-top:8px}
#status{margin-top:14px;text-align:center;color:#aaa}
</style>
</head>
<body>
<<div class="card">
<h1>APP KEY</h1>
<div class="muted">Nhập key để vào APP OB54⚡</div>
<input id="keyInput" placeholder="HK-XXXX-XXXX-XXXX" autocomplete="off">
<button id="activate">KÍCH HOẠT</button>
<div id="status">Sẵn sàng.</div>
</div>
<script src="script.js"></script>
</body>
</html>
