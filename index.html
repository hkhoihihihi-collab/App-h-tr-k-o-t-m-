<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOANG KHOI KEY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <main class="app">
    <section class="card">
      <div class="topline"></div>

      <header>
        <div class="brand-icon">HK</div>
        <div>
          <div class="eyebrow">SECURE LICENSE SYSTEM</div>
          <h1>HOANG KHOI KEY</h1>
        </div>
      </header>

      <div class="section-title">MÃ KÍCH HOẠT</div>
      <div class="input-row">
        <input id="keyInput" type="text" placeholder="HK-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
        <button class="mini-btn" id="pasteBtn">DÁN</button>
        <button class="mini-btn danger" id="clearBtn">×</button>
      </div>

      <div class="actions">
        <button class="main-btn" id="checkBtn">KIỂM TRA KEY</button>
        <button class="main-btn outline" id="activateBtn">KÍCH HOẠT (1 THIẾT BỊ)</button>
      </div>

      <div id="result" class="result">
        <div class="status-dot"></div>
        <div>
          <div id="statusTitle">Sẵn sàng.</div>
          <div id="statusDetail">Chưa Kích Hoạt</div>
        </div>
      </div>

      <div id="keyDetails" class="details hidden">
        <div class="detail">
          <span>TRẠNG THÁI</span>
          <strong id="keyState">—</strong>
        </div>
        <div class="detail">
          <span>HẠN SỬ DỤNG</span>
          <strong id="expiry">—</strong>
        </div>
        <div class="detail">
          <span>THIẾT BỊ</span>
          <strong id="deviceState">1 THIẾT BỊ</strong>
        </div>
      </div>

      <a class="main-btn outline contact-btn" id="contactBtn" href="https://zalo.me/+84799886109" target="_blank" rel="noopener">Liên Hệ Lấy Key</a>

      <div class="footer">HOANG KHOI • 1 KEY / 1 DEVICE</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
