<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIMHELP OB54⚡</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505}
body{color:#fff;font-family:Arial,sans-serif;overflow-x:hidden;background:radial-gradient(circle at 50% -10%,#430606 0,#170707 28%,#090909 58%,#050505 100%)}
body:before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:-2;background:radial-gradient(circle at 20% 30%,rgba(255,30,30,.14),transparent 25%),radial-gradient(circle at 80% 65%,rgba(255,0,0,.10),transparent 23%);filter:blur(20px);animation:bgFloat 9s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background-image:linear-gradient(rgba(255,40,40,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,40,40,.035) 1px,transparent 1px);background-size:38px 38px;animation:gridMove 12s linear infinite}
.wrap{width:min(94vw,520px);margin:auto;padding:22px 14px 28px}
.header{text-align:center;margin-bottom:18px;animation:drop .6s both}
.title{font-size:30px;font-weight:900;color:#ff3030;text-shadow:0 0 14px #f00,0 0 34px rgba(255,0,0,.3);animation:glow 2.5s ease-in-out infinite}
.sub{color:#aaa;font-size:12px;margin-top:4px;letter-spacing:1.5px}
.panel{position:relative;overflow:hidden;background:rgba(17,17,17,.93);border:1px solid #481212;border-radius:18px;padding:10px;box-shadow:0 0 26px rgba(255,0,0,.14),inset 0 0 25px rgba(255,0,0,.025);backdrop-filter:blur(8px);animation:rise .7s .08s both}
.panel:before{content:"";position:absolute;left:-35%;top:0;width:35%;height:1px;background:#ff4545;box-shadow:0 0 12px #ff3030;animation:scan 4s linear infinite}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;border-bottom:1px solid #242424;gap:12px;opacity:0;animation:rowIn .45s cubic-bezier(.2,.8,.2,1) forwards;transition:background .2s,transform .2s}
.row:hover{background:rgba(255,20,20,.07);transform:translateX(3px)}
.row:last-child{border-bottom:0}
.name{font-weight:900;font-size:15px}
.desc{display:block;color:#888;font-size:10px;margin-top:5px;line-height:1.3}
.switch{flex:none;width:58px;height:32px;border-radius:20px;background:#242424;border:1px solid #444;padding:3px;cursor:pointer;transition:.2s;box-shadow:inset 0 0 8px #0008}
.knob{width:24px;height:24px;border-radius:50%;background:#777;transition:.22s cubic-bezier(.2,.9,.2,1)}
.switch.on{background:#168b3b;border-color:#39d96a;box-shadow:0 0 16px rgba(57,217,106,.25)}
.switch.on .knob{transform:translateX(26px);background:#fff;box-shadow:0 0 12px #70ff91}
.switch:active .knob{transform:scale(.88)}
.switch.on:active .knob{transform:translateX(26px) scale(.88)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;animation:rise .7s .25s both}
.actions button{position:relative;overflow:hidden;padding:13px 8px;border-radius:12px;border:1px solid #7d1616;background:#160909;color:#fff;font-weight:900;cursor:pointer;transition:.18s}
.actions button:before{content:"";position:absolute;top:0;left:-120%;width:70%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transform:skewX(-20deg);transition:left .45s}
.actions button:hover{transform:translateY(-2px);border-color:#ff3030;box-shadow:0 8px 22px rgba(255,0,0,.18)}
.actions button:hover:before{left:150%}
.actions button:active{transform:scale(.97)}
.status{text-align:center;color:#888;font-size:11px;margin-top:9px;min-height:14px;animation:fade 1s .5s both}
.admin{text-align:center;margin-top:20px;font-size:25px;font-weight:900;color:#ff3030;text-shadow:0 0 12px #f00;animation:glow 2.8s ease-in-out infinite}
@keyframes bgFloat{to{transform:translate(2%,2%) scale(1.06)}}
@keyframes gridMove{to{background-position:38px 38px}}
@keyframes glow{50%{text-shadow:0 0 18px #f00,0 0 42px rgba(255,0,0,.45)}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes scan{to{left:130%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media(max-width:420px){.title{font-size:27px}.admin{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
<header class="header">
<div class="title">AIMHELP OB54⚡</div>
<div class="sub">APP OB54</div>
</header>
<section class="panel" id="features"></section>
<div class="actions">
<button id="ffth">OPEN FREE FIRE TH</button>
<button id="ffmax">OPEN FREE FIRE MAX</button>
</div>
<div class="status" id="status">Đang xác thực session...</div>
<div class="admin">ADMIN HOÀNG KHÔI</div>
</div>
<script src="main.js"></script>
</body>
</html>
