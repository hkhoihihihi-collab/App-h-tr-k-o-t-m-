<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIMHELP OB54⚡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#250000 0,#090909 42%,#050505 100%);color:#fff;font-family:Arial,sans-serif;min-height:100vh}
.wrap{width:min(94vw,520px);margin:auto;padding:22px 14px 28px}
.header{text-align:center;margin-bottom:18px}.title{font-size:30px;font-weight:900;color:#ff2d2d;text-shadow:0 0 14px #ff0000}.sub{color:#bbb;font-size:12px;margin-top:4px}
.panel{background:rgba(17,17,17,.94);border:1px solid #3c1111;border-radius:18px;padding:10px;box-shadow:0 0 26px rgba(255,0,0,.12)}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;border-bottom:1px solid #242424}.row:last-child{border-bottom:0}.name{font-weight:800}.file{display:block;color:#777;font-size:10px;margin-top:4px}
.switch{width:58px;height:32px;border-radius:20px;background:#242424;border:1px solid #444;padding:3px;cursor:pointer;transition:.18s}.knob{width:24px;height:24px;border-radius:50%;background:#777;transition:.18s}.switch.on{background:#168b3b;border-color:#39d96a}.switch.on .knob{transform:translateX(26px);background:#fff;box-shadow:0 0 12px #70ff91}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{padding:13px 8px;border-radius:12px;border:1px solid #7d1616;background:#160909;color:#fff;font-weight:900;cursor:pointer}.actions button:active{transform:scale(.98)}
.admin{text-align:center;margin-top:20px;font-size:22px;font-weight:900;color:#ff3030;text-shadow:0 0 12px #ff0000}.status{text-align:center;color:#888;font-size:11px;margin-top:9px}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="title">AIMHELP OB54⚡</div>
    <div class="sub">APP OB54</div>
  </header>
  <section class="panel" id="features"></section>
  <div class="actions">
    <button id="ffth">OPEN FREE FIRE TH</button>
    <button id="ffmax">OPEN FREE FIRE MAX</button>
  </div>
  <div class="status" id="status">Đang xác thực session...</div>
  <div class="admin">ADMIN HOÀNG KHÔI</div>
</div>
<script src="main.js"></script>
</body>
</html>
